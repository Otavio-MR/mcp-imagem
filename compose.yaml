services:
   # nome do serviço exibido na interface e pelos comandos do Docker
   mcp-inspector:
     # executa o "build" da imagem definido no arquivo "Dockerfile"
     build:
       context: .
       dockerfile: Dockerfile
     # nome do contêiner
     container_name: mcp-inspector
     # servidor/ip e porta em que a aplicação responderá
     ports:
       - "127.0.0.1:6274:6274"
     # pasta de imagens (dentro do contêiner) que o servidor MCP poderá ler
     environment:
       - IMG_DIR=/opt/mcp/imagens
     #
     # ro: read-only
     volumes:
       - ./server:/opt/mcp/server:ro
       - ./imagens:/opt/mcp/imagens:ro
     # executa o servidor MCP em Java; o "-e" repassa o IMG_DIR ao servidor,
     # porque o Inspector não passa as variáveis do contêiner adiante
     command:
       - -e
       - IMG_DIR=/opt/mcp/imagens
       - java
       - -jar
       - /opt/mcp/server/mcp_imagens_server.jar
